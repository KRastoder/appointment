# =====================================================================
# Modular monolith + PostgreSQL.
#
#   docker compose up --build
#
# Copy .env.example to .env first (Compose reads .env automatically).
# =====================================================================
services:

  db:
    image: postgres:17-alpine
    container_name: doctor-appointment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-doctor_appointments}
      POSTGRES_USER: ${DB_USERNAME:-doctor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doctor}
      # Deterministic collation, independent of the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Exposed for local development (psql, IDE database tools).
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-doctor} -d ${DB_NAME:-doctor_appointments}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctor-appointment-app
    restart: unless-stopped
    depends_on:
      db:
        # Wait until PostgreSQL is actually accepting connections.
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-doctor_appointments}
      DB_USERNAME: ${DB_USERNAME:-doctor}
      DB_PASSWORD: ${DB_PASSWORD:-doctor}
      SERVER_PORT: 8080
      # HMAC key for the JWT signature (min. 32 bytes).
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
      # First ADMIN account, created on first start only.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@doctor-appointment.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin12345}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
