# ---------------------------------------------------------------------
# Test profile. The datasource itself is provided per test class by
# Testcontainers (see PostgresTestSupport).
#
# Allow overriding the PasswordEncoder bean with a fast test encoder
# (BCrypt with the default cost makes the HTTP tests unnecessarily slow).
# ---------------------------------------------------------------------
spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    clean-disabled: true
