# ---------------------------------------------------------------------
# Doctor Appointment Booking - application configuration
# Everything environment specific comes from environment variables
# (see .env.example). Defaults below are for local development.
# ---------------------------------------------------------------------
spring:
  application:
    name: doctor-appointment

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:doctor_appointments}
    username: ${DB_USERNAME:doctor}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema. Hibernate only validates it.
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    # Never create/update the schema - Flyway migrations are the source of truth.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

# ---------------------------------------------------------------------
# Simple hand-rolled HS256 JWT (no OAuth2 libraries).
# JWT_SECRET must be at least 32 bytes; the default is for local dev only.
# ---------------------------------------------------------------------
app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
      issuer: doctor-appointment
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  bootstrap:
    admin:
      # First ADMIN account, created on first start only (only an ADMIN may
      # create accounts). Set BOOTSTRAP_ADMIN_EMAIL= to disable.
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@doctor-appointment.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin12345}
