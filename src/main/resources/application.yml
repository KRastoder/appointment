# ---------------------------------------------------------------------
# Doctor Appointment Booking backend - application configuration
# Everything environment specific comes from environment variables.
# NO credentials are stored in this file (see .env.example).
# ---------------------------------------------------------------------
spring:
  application:
    name: doctor-appointment

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:doctor_appointments}
    username: ${DB_USERNAME:doctor}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  # Flyway owns the schema. Hibernate only validates it.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    # Never create/update the schema - Flyway migrations are the source of truth.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 30
        order_inserts: true

  # Spring Boot 4 uses Jackson 3, which serialises java.time values as
  # ISO-8601 strings by default (OffsetDateTime -> "2026-11-02T10:00+01:00").
  # No explicit date/time feature is needed.

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

logging:
  level:
    com.keni.doctorappointment: INFO
